name: Deploy to Vercel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          
      - name: Deploy to Vercel (Production)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prod'
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          
      - name: Deploy to Vercel (Preview)
        if: (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') && secrets.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--no-wait'
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          
      - name: Build Success
        run: |
          echo "✅ Build completed successfully!"
          echo "📦 Application is ready for deployment"
          echo "🔧 To enable Vercel deployment, add the following secrets to your repository:"
          echo "   - VERCEL_TOKEN"
          echo "   - VERCEL_ORG_ID" 
          echo "   - VERCEL_PROJECT_ID"
          
      - name: Comment PR with build status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildSuccess = true; // Build completed if we reach this step
            const hasVercelSecrets = '${{ secrets.VERCEL_TOKEN }}' !== '';
            
            let message = '✅ **Build Completed Successfully!**\n\n';
            message += '📦 Your application has been built and is ready for deployment.\n\n';
            
            if (hasVercelSecrets) {
              // If Vercel secrets are available, try to get deployment info
              try {
                const { data: deployments } = await github.rest.repos.listDeployments({
                  owner: context.repo.owner,
                  repo: context.repo.repo
                });
                const latestDeployment = deployments[0];
                if (latestDeployment) {
                  const deploymentUrl = `https://${latestDeployment.environment}.vercel.app`;
                  message += `🚀 **Preview Deployment:** ${deploymentUrl}\n\n`;
                }
              } catch (error) {
                console.log('Could not fetch deployment info:', error.message);
              }
            } else {
              message += '💡 **To enable automatic Vercel deployment:**\n';
              message += '1. Add `VERCEL_TOKEN` to repository secrets\n';
              message += '2. Add `VERCEL_ORG_ID` to repository secrets\n';
              message += '3. Add `VERCEL_PROJECT_ID` to repository secrets\n\n';
              message += '📖 [Learn more about Vercel deployment](https://vercel.com/docs/concepts/git)\n\n';
            }
            
            message += 'This build will be automatically updated when you push new commits to this PR.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
